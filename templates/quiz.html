{% extends "nav-base.html" %} {% block title %} Quiz {% endblock %} 
{% block header %}
    <h1>QUIZ</h1> 
{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
{% endblock %} {% block content%}
<main class="container">
  <h1>JavaScript Quiz</h1>
  <section id="quizPanel">
    <p id="progress"></p>
    <h2 id="questionText"></h2>
    <div id="choices"></div>
    <div class="navigation">
      <button id="firstBtn" onclick="goFirst()">First</button>
      <button id="previousBtn" onclick="goPrevious()">Previous</button>
      <button id="nextBtn" onclick="goNext()">Next</button>
      <button id="lastBtn" onclick="goLast()">Last</button>
    </div>
    <button class="submit" onclick="submitQuiz()">Submit Quiz</button>
  </section>
  <section id="resultsPanel">
    <h2>Quiz Results</h2>
    <p id="scoreText"></p>
    <p id="percentageText"></p>
    <p id="performanceText"></p>
    <h3>Correction</h3>
    <pre id="correction"></pre>
  </section>
</main>
<script src="{{ url_for('static', filename='quiz.js') }}"></script>
<script>
(function () {
  var COLORS = ["#2ec4b6", "#0f7f75", "#2a9fd6", "#0a1f33", "#ffd166", "#ffffff"];

  function launchConfetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.createElement("canvas");
    c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999";
    document.body.appendChild(c);
    c.width = innerWidth; c.height = innerHeight;
    var ctx = c.getContext("2d"), start = performance.now(), DUR = 4500, P = [];

    for (var i = 0; i < 170; i++) {
      var left = i % 2 === 0, a = ((left ? -65 : -115) + Math.random() * 30 - 15) * Math.PI / 180;
      var sp = 5 + Math.random() * 11;
      P.push({ x: left ? 0 : c.width, y: c.height, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: Math.random() * .7 - .35,
        col: COLORS[Math.floor(Math.random() * COLORS.length)] });
    }

    (function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, c.width, c.height);
      P.forEach(function (p) {
        p.vy += .32; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = t > DUR - 1200 ? Math.max(0, (DUR - t) / 1200) : 1;
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (t < DUR) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  document.addEventListener("DOMContentLoaded", function () {
    var el = document.getElementById("percentageText");
    if (!el) return;
    new MutationObserver(function () {
      var m = el.textContent.match(/(\d+(?:\.\d+)?)\s*%/);
      if (m && parseFloat(m[1]) >= 80) launchConfetti();
    }).observe(el, { childList: true, characterData: true, subtree: true });
  });
})();
</script>
{% endblock %}
